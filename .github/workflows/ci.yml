name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Reads the toolchain and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotless:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml
      - run: scripts/fetch-icechunk-fixtures.sh
        shell: bash
      # pcodec 1.0.4 has no wheels for Python 3.15, and its PyO3 refuses to build for 3.15.
      # Without a pin, uv uses a 3.15 it finds on PATH, as on macos-latest.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      # The jars target Java 8, so the tests also run on a Java 8 JVM, against the Java 8
      # classes. The build itself needs JDK 21 for Error Prone. Temurin has no Java 8 build
      # for Apple silicon, so Java 8 comes from Zulu.
      - uses: actions/setup-java@v6.0.1
        id: jdk8
        with:
          distribution: zulu
          java-version: "8"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test on JDK 21
        run: mvn -B verify "-Dicechunk.tests.strict=true"
      # hegel needs Java 17, so the property tests run only on JDK 21.
      - name: Test on JDK 8
        shell: bash
        run: mvn -B verify -pl '!property-tests' "-Dicechunk.tests.strict=true" "-Djvm=${{ steps.jdk8.outputs.path }}/bin/java"
