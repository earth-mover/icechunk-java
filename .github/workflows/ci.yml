name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads the toolchain and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotless:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml
      - run: scripts/fetch-icechunk-fixtures.sh
        shell: bash
      - uses: astral-sh/setup-uv@v6
      # The jars target Java 11, so the tests also run on a Java 11 JVM. The build itself
      # needs JDK 21 for Error Prone.
      - uses: actions/setup-java@v5
        id: jdk11
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test on JDK 21
        run: mvn -B verify "-Dicechunk.tests.strict=true"
      - name: Test on JDK 11
        shell: bash
        run: mvn -B surefire:test "-Dicechunk.tests.strict=true" "-Djvm=${{ steps.jdk11.outputs.path }}/bin/java"
