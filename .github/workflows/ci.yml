name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the toolchain and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B spotless:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo build --manifest-path native/Cargo.toml
      - run: scripts/fetch-icechunk-fixtures.sh
        shell: bash
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The jars target Java 8, so the tests also run on a Java 8 JVM, against the Java 8
      # classes. The build itself needs JDK 21 for Error Prone. Temurin has no Java 8 build
      # for Apple silicon, so Java 8 comes from Zulu.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: jdk8
        with:
          distribution: zulu
          java-version: "8"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test on JDK 21
        run: mvn -B verify "-Dicechunk.tests.strict=true"
      - name: Test on JDK 8
        shell: bash
        run: mvn -B verify "-Dicechunk.tests.strict=true" "-Djvm=${{ steps.jdk8.outputs.path }}/bin/java"
