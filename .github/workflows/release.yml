name: Release

# Builds the native library for every supported platform, bundles all of them into the
# icechunk-java jar, and attaches the jars to a draft GitHub release. A person reviews and
# publishes the draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux containers so the library loads on older
          # distributions, as icechunk-python's wheels do.
          - platform: linux-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            file: libicechunk_jni.so
          - platform: linux-aarch_64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            file: libicechunk_jni.so
          - platform: osx-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            file: libicechunk_jni.dylib
          - platform: osx-aarch_64
            runner: macos-latest
            target: aarch64-apple-darwin
            file: libicechunk_jni.dylib
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            file: icechunk_jni.dll
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: artifacts
      - name: Bundle the native libraries
        run: |
          dest=icechunk-java/src/main/resources/io/earthmover/icechunk/native
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            mkdir -p "$dest/$platform"
            cp "$dir"/* "$dest/$platform/"
          done
          find "$dest" -type f | sort
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v6
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      # An empty icechunk.native.dir makes the tests load the library bundled in the jar,
      # the way users will.
      - name: Build and test against the bundled library
        run: |
          scripts/fetch-icechunk-fixtures.sh
          mvn -B verify -Dicechunk.native.dir= -Dicechunk.tests.strict=true
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            icechunk-java/target/icechunk-java-*.jar
            icechunk-zarr-java/target/icechunk-zarr-java-*.jar
            icechunk-java/target/classes/io/earthmover/icechunk/native/

  # Each platform's library was built on that platform, but only Linux x86_64 loaded it from
  # the jar above. Run the tests once per platform against the bundled libraries.
  test-bundled:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: jars
          path: jars
      - name: Put the bundled libraries on the test classpath
        shell: bash
        run: |
          mkdir -p icechunk-java/src/main/resources/io/earthmover/icechunk
          cp -R "$(find jars -type d -name native -path '*io/earthmover/icechunk/native' | head -1)" \
            icechunk-java/src/main/resources/io/earthmover/icechunk/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v6
      - name: Test against the bundled library
        shell: bash
        run: |
          scripts/fetch-icechunk-fixtures.sh
          mvn -B verify -Dicechunk.native.dir= -Dicechunk.tests.strict=true

  release:
    needs: [package, test-bundled]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: jars
          path: jars
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Experimental, unofficial build. See the README." \
            $(find jars -name 'icechunk-*.jar')
