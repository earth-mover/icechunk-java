name: Release

# Builds the native library for every supported platform, bundles all of them into the
# icechunk-java jar, uploads the jars to Maven Central, and attaches them to a draft GitHub
# release. A person reviews and publishes both: the draft release on GitHub, and the
# validated deployment on central.sonatype.com.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Upload the build to Maven Central under this version, for validation. Nothing is
          published until someone presses Publish on central.sonatype.com; drop the
          deployment there instead to discard it.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux containers so the library loads on older
          # distributions, as icechunk-python's wheels do.
          - platform: linux-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            file: libicechunk_jni.so
          - platform: linux-aarch_64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            file: libicechunk_jni.so
          - platform: osx-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            file: libicechunk_jni.dylib
          - platform: osx-aarch_64
            runner: macos-latest
            target: aarch64-apple-darwin
            file: libicechunk_jni.dylib
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            file: icechunk_jni.dll
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  # The license notices of the crates compiled into the native library, which binary
  # distributions must carry. Covers every target listed in native/about.toml.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate THIRD-PARTY-LICENSES
        run: |
          cargo install --locked cargo-about@0.9.3 --features cli
          cargo about generate --manifest-path native/Cargo.toml -c native/about.toml \
            native/about.hbs -o THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES
          if-no-files-found: error

  package:
    needs: [native, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: artifacts
      - name: Bundle the native libraries
        run: scripts/bundle-native-libs.sh artifacts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: third-party-licenses
          path: icechunk-java/src/main/resources/META-INF
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      # test-bundled runs the tests, on every platform.
      - name: Build the jars
        run: mvn -B package -Dmaven.test.skip=true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jars
          path: |
            icechunk-java/target/icechunk-java-*.jar
            icechunk-zarr-java/target/icechunk-zarr-java-*.jar
            icechunk-n5/target/icechunk-n5-*.jar
            icechunk-n5-codecs/target/icechunk-n5-codecs-*.jar
            icechunk-java/src/main/resources/META-INF/THIRD-PARTY-LICENSES

  # Runs the tests on each platform against the release libraries, bundled the way the
  # package job bundles them.
  test-bundled:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: artifacts
      - name: Bundle the native libraries
        shell: bash
        run: scripts/bundle-native-libs.sh artifacts
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # pcodec 1.0.4 has no wheels for Python 3.15, and its PyO3 refuses to build for 3.15.
      # Without a pin, uv uses a 3.15 it finds on PATH, as on macos-latest.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Test against the bundled library
        shell: bash
        run: |
          scripts/fetch-icechunk-fixtures.sh
          # hegel, which runs the property tests, has no library for Intel macOS.
          skip=""
          if [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 ]]; then
            skip="-pl !property-tests"
          fi
          mvn -B verify -Dicechunk.native.dir= -Dicechunk.tests.strict=true $skip

  # Rebuilds the jars rather than reusing the package job's, because deploy needs the
  # reactor's POMs. The tests already passed on the same sources.
  publish:
    needs: [licenses, package, test-bundled]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    # The environment holds the signing key and Central token, so they are only exposed
    # to runs its protection rules allow.
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: artifacts
      - name: Bundle the native libraries
        run: scripts/bundle-native-libs.sh artifacts
      - uses: actions/download-artifact@v8.0.1
        with:
          name: third-party-licenses
          path: icechunk-java/src/main/resources/META-INF
      # setup-java imports the signing key and writes a settings.xml server "central" that
      # reads its credentials from the environment variables named here.
      # No dependency cache: a poisoned cache would end up in the published jars.
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          # The plugin sends snapshots straight to Central's snapshot repository, skipping
          # the validated deployment that waits for someone to press Publish.
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Refusing to upload snapshot version $version"
            exit 1
          fi
          mvn -B -q versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Upload to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -Pcentral -Dmaven.test.skip=true

  release:
    needs: [package, test-bundled]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: jars
          path: jars
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Experimental, unofficial build. See the README." \
            $(find jars -name 'icechunk-*.jar' -o -name THIRD-PARTY-LICENSES)
