[package]
name = "icechunk-jni"
version = "0.1.0"
description = "JNI layer for the experimental icechunk Java bindings"
repository = "https://github.com/earth-mover/icechunk"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[lib]
name = "icechunk_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
icechunk = { git = "https://github.com/earth-mover/icechunk", rev = "468004ab7cc4e8c71d10df58510292eba64ceb5d" }
jni = "0.22.4"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync"] }
bytes = "1.11.1"
crossbeam-epoch = "0.9.21"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints.rust]
bare_trait_objects = "warn"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "deny"
expect_used = "deny"
implicit_clone = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
panic = "deny"
semicolon_if_nothing_returned = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
uninlined_format_args = "warn"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
