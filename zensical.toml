[project]
site_name = "icechunk-java"
site_description = "Experimental Java bindings for icechunk"
site_url = "https://earth-mover.github.io/icechunk-java/"
nav = [
  { "Home" = "index.md" },
  { "How the pieces fit" = "ecosystem.md" },
  { "N5" = "n5.md" },
  { "Use in Fiji" = "fiji.md" },
  { "Example: StarDist" = "stardist.md" },
  { "Example: save results" = "write-back.md" },
  { "Changes in other projects" = "upstream.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# Code samples are sections of the runnable programs in examples/, so they compile with the build.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["examples/src/main/java/io/earthmover/icechunk/examples"]
check_paths = true
dedent_subsections = true
