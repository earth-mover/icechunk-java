[workspace]
name = "icechunk-java"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
openjdk = "21.*"
maven = "3.9.*"

[tasks]
build-native = { cmd = "cargo build --manifest-path native/Cargo.toml" }
lint-native = { cmd = "cargo fmt --manifest-path native/Cargo.toml --check && cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings" }
test-native = { cmd = "cargo test --manifest-path native/Cargo.toml" }
format = { cmd = "cargo fmt --manifest-path native/Cargo.toml && mvn -q spotless:apply" }
fetch-fixtures = { cmd = "scripts/fetch-icechunk-fixtures.sh" }
test = { cmd = "mvn -B verify", depends-on = ["build-native", "fetch-fixtures"] }
test-strict = { cmd = "mvn -B verify -Dicechunk.tests.strict=true", depends-on = ["build-native", "fetch-fixtures"] }
example = { cmd = "mvn -B -q install -DskipTests -pl examples -am && mvn -B -q -pl examples exec:java -Dexample={{ name }}", args = [{ arg = "name", default = "Quickstart" }], depends-on = ["build-native"] }
build-native-release = { cmd = "cargo build --release --manifest-path native/Cargo.toml" }
bench = { cmd = "mvn -B -q package -DskipTests -pl benchmarks -am && java -jar benchmarks/target/benchmarks.jar -jvmArgsAppend -Dicechunk.native.dir=native/target/release -prof gc -rf json -rff benchmarks/target/results.json {{ args }}", args = [{ arg = "args", default = "" }], depends-on = ["build-native-release"] }
check = { depends-on = ["lint-native", "test-native", "test"] }
